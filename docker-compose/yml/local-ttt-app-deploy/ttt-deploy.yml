apiVersion: apps/v1
kind: Deployment
metadata:
  name: ttt-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ttt-app
  template:
    metadata:
      labels:
        app: ttt-app
    spec:
      containers:
        - name: ttt-app
          image: albertina1310/tech610-tttapp:1.2.0
