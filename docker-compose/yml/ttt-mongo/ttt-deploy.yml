apiVersion: apps/v1
kind: Deployment
metadata:
  name: ttt-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ttt-app
  template:
    metadata:
      labels:
        app: ttt-app
    spec:
      containers:
        - name: ttt-app
          image: albertina1310/tech610-tttapp:1.2.0
          env:
            - name: MONGODB_URI
              value: mongodb://ttt-mongo:27017/posts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ttt-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ttt-mongo
  template:
    metadata:
      labels:
        app: ttt-mongo
    spec:
      containers:
        - name: mongodb
          image: mongo:8.0
