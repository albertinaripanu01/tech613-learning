apiVersion: v1
kind: Service
metadata:
  name: ttt-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: ttt-app
  ports:
    - nodePort: 30003
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: ttt-mongo
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: ttt-mongo
  ports:
    - port: 27017
      targetPort: 27017
