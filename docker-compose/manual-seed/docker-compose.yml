services:
  db:
    image: mongo:7.0.22
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: albertina1310/tech610-tttapp:1.2.0
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://db:27017/tictactoe
      STATEFUL_MODE: server
    depends_on:
      db:
        condition: service_healthy

volumes:
  mongo-data:

