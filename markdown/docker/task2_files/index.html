<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Christmas</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101827; color: #eef4ff; }
    main { max-width: 42rem; padding: 3rem; border: 1px solid #34435b; border-radius: 1rem; background: #19263a; text-align: center; }
    h1 { margin: .7rem 0; color: #67e8c0; font-size: clamp(2rem, 7vw, 4rem); }
    p { color: #c0ccdc; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Happy Christmas!</h1>
    <p>Wishing you a joyful holiday season, served fresh by nginx.</p>
  </main>
</body>
</html>
