# Friday's deployment config, in full. A valid one.
#
# You are not expected to know YAML yet - that is the next lesson. The line that
# parses this file is already written for you in load_config.py. Your job is
# what happens *after* it parses.

app_name: flask-demo
release_version: v2
releases_dir: ~/deploy-project/releases
deploy_dir: ~/deploy-project/app/current
backup_dir: ~/deploy-project/app/backup
app_port: 8801
health_check_url: http://localhost:8801/health
health_check_retries: 5
health_check_delay_seconds: 2
